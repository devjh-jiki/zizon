name: Check doc pairs

# 한/영 문서 쌍을 검사한다. 검사 셋 전부 "파일이 있는가"가 아니라
# "실제로 깨지는 것"을 본다.
#
#   A. SKILL.md 의 description 이 영어인가.  Claude 가 스킬을 고를 때 읽는 값이다
#   B. 짝 없는 .ko.md 가 있는가.             원본을 지우고 번역만 남긴 경우
#   C. 번역이 원본의 구조를 따라오는가.       원본에 절이 생겼는데 번역에 없으면 실패
#
# 옛 판본은 "모든 X.md 에 X.ko.md 가 있어야 한다"만 봤다. 그 검사는
# 존재만 보고 내용을 안 봐서, 영어에 절을 넣고 한국어를 안 고친 커밋
# b53f162 를 그대로 통과시켰다. 잡으라고 만든 결함을 놓친 것이다.
# 반대로 한국어로 쓴 스킬(writing 버킷)은 영어 사본이 없다는 이유로
# 실패시켰다. 잡을 것은 놓치고 안 잡을 것은 잡았으므로 규칙을 바꿨다.
#
# 번역 의무는 없앴다. .ko.md 는 만들지 않아도 된다.
# 다만 **만들었으면 원본을 따라와야 한다.** 반쯤 낡은 번역이 없는 것보다 나쁘다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs
        run: python3 .github/scripts/check_doc_pairs.py
